<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova Browser</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="/uv/uv.bundle.js"></script>
  <script src="/uv/uv.config.js"></script>
  <style>
    :root { 
      --cyan: #00f0ff; 
      --violet: #8b5cf6; 
      --magenta: #ec4899; 
      --bg: #030712; 
      --header-bg: rgba(15, 23, 42, 0.75);
      --input-bg: rgba(3, 7, 18, 0.6);
      --border: rgba(255, 255, 255, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { 
      background-color: var(--bg); 
      color: #f8fafc; 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      height: 100vh; 
      display: flex; 
      flex-direction: column;
      overflow: hidden; 
      position: relative; 
    }

    /* Background Animated Orbs */
    .bg-mesh { position: absolute; inset: 0; overflow: hidden; z-index: 0; pointer-events: none; }
    .orb { position: absolute; border-radius: 50%; filter: blur(120px); opacity: 0.3; will-change: transform; }
    .orb-1 { width: 500px; height: 500px; background: radial-gradient(circle, var(--cyan), transparent 70%); top: -15%; left: -10%; animation: float-1 14s ease-in-out infinite alternate; }
    .orb-2 { width: 600px; height: 600px; background: radial-gradient(circle, var(--violet), transparent 70%); bottom: -20%; right: -10%; animation: float-2 18s ease-in-out infinite alternate; }
    .orb-3 { width: 400px; height: 400px; background: radial-gradient(circle, var(--magenta), transparent 70%); top: 40%; left: 50%; animation: float-3 12s ease-in-out infinite alternate; }
    @keyframes float-1 { 0% { transform: translate3d(0, 0, 0) scale(1); } 100% { transform: translate3d(80px, 60px, 0) scale(1.15); } }
    @keyframes float-2 { 0% { transform: translate3d(0, 0, 0) scale(1); } 100% { transform: translate3d(-70px, -90px, 0) scale(1.1); } }
    @keyframes float-3 { 0% { transform: translate3d(-50%, -50%, 0) scale(0.9); } 100% { transform: translate3d(-30%, -40%, 0) scale(1.2); } }

    /* Browser Control Bar */
    .browser-bar {
      position: relative;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      background: var(--header-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
    }

    .nav-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: #94a3b8;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      transform: translateY(-1px);
    }

    .icon-btn:active {
      transform: translateY(0);
    }

    .icon-btn svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Address Bar Form */
    .address-form {
      flex: 1;
      display: flex;
      align-items: center;
      position: relative;
    }

    .address-wrapper {
      width: 100%;
      display: flex;
      align-items: center;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0 14px;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .address-wrapper:focus-within {
      border-color: rgba(0, 240, 255, 0.6);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
      background: rgba(3, 7, 18, 0.85);
    }

    .site-icon {
      color: var(--cyan);
      margin-right: 10px;
      display: flex;
      align-items: center;
    }

    .address-input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 0.9rem;
      font-family: inherit;
      padding: 10px 0;
    }

    .address-input::placeholder { color: #64748b; }

    /* Action Badges & Buttons */
    .status-container {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #94a3b8;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #eab308;
      box-shadow: 0 0 10px #eab308;
    }

    .status-dot.ready { background: var(--cyan); box-shadow: 0 0 10px var(--cyan); }

    /* Browser Content Area */
    .browser-viewport {
      position: relative;
      flex: 1;
      width: 100%;
      height: calc(100vh - 57px);
      z-index: 10;
    }

    iframe#web-frame {
      width: 100%;
      height: 100%;
      border: none;
      background: #fff;
      display: none;
    }

    /* Home Splash Hero Screen */
    .home-splash {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 20;
    }

    .glass-card {
      width: 100%;
      max-width: 560px;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(28px) saturate(200%);
      -webkit-backdrop-filter: blur(28px) saturate(200%);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 28px;
      padding: 40px;
      text-align: center;
      box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.8);
      animation: card-entrance 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes card-entrance { 
      from { opacity: 0; transform: translate3d(0, 20px, 0) scale(0.96); } 
      to { opacity: 1; transform: translate3d(0, 0, 0) scale(1); } 
    }

    h1 { font-size: 2.2rem; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 8px; color: #fff; }
    h1 .glow-text { 
      background: linear-gradient(135deg, var(--cyan) 0%, #a855f7 50%, var(--magenta) 100%); 
      background-size: 200% auto; 
      -webkit-background-clip: text; 
      -webkit-text-fill-color: transparent; 
      animation: shine 6s linear infinite; 
    }
    @keyframes shine { to { background-position: 200% center; } }
    
    p.subtitle { color: #94a3b8; font-size: 0.95rem; margin-bottom: 28px; font-weight: 500; }

    /* Quick Shortcuts Grid */
    .shortcuts-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-top: 24px;
    }

    .shortcut-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      color: #e2e8f0;
      font-size: 0.75rem;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .shortcut-card:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--cyan);
      transform: translateY(-2px);
    }

    .shortcut-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    /* Nova product system: compact navy surfaces and a quiet dotted canvas. */
    :root {
      --cyan: #8fb9f8;
      --violet: #9b8ff6;
      --magenta: #8fb9f8;
      --bg: #101827;
      --header-bg: #0b1320;
      --input-bg: #111c2c;
      --border: #293b57;
    }
    body {
      background-color: var(--bg);
      background-image: radial-gradient(circle, #253249 2.5px, transparent 2.5px);
      background-size: 24px 24px;
    }
    .bg-mesh { display: none; }
    .browser-bar {
      min-height: 68px;
      padding: 10px 20px;
      gap: 10px;
      background: var(--header-bg);
      border-bottom-color: #1d2b40;
      box-shadow: none;
      backdrop-filter: none;
    }
    .browser-brand {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: max-content;
      margin-right: 8px;
      color: #f0f6ff;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -.04em;
    }
    .browser-brand .mark {
      width: 25px;
      height: 25px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: #eef5ff;
      color: #101827;
      font-size: 17px;
      clip-path: polygon(40% 0,100% 0,67% 39%,91% 39%,28% 100%,39% 57%,8% 57%);
    }
    .browser-brand span:last-child { color: #91acd3; font-weight: 500; }
    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      background: #142136;
      color: #93a9c8;
      box-shadow: none;
    }
    .icon-btn:hover { background: #1b2b44; color: #e4efff; transform: none; }
    .address-wrapper {
      height: 42px;
      border-radius: 11px;
      background: var(--input-bg);
      border-color: #304561;
      padding-right: 4px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.02);
    }
    .address-wrapper:focus-within {
      border-color: #79a9eb;
      box-shadow: 0 0 0 3px rgba(121,169,235,.12);
      background: #111c2c;
    }
    .site-icon { color: #8fb9f8; }
    .address-input { color: #eaf2ff; }
    .status-container {
      min-height: 36px;
      border-radius: 9px;
      background: #142136;
      border-color: #293b57;
      color: #93a9c8;
    }
    .status-dot { background: #d7a958; box-shadow: none; }
    .status-dot.ready { background: #72d6b3; box-shadow: 0 0 0 4px rgba(114,214,179,.09); }
    .browser-viewport { height: calc(100vh - 68px); }
    .home-splash { justify-content: flex-start; padding: clamp(62px,10vh,110px) 24px 40px; }
    .glass-card {
      max-width: 680px;
      padding: 0;
      border: 0;
      background: transparent;
      box-shadow: none;
      backdrop-filter: none;
      animation: none;
    }
    .home-lockup { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 28px; }
    .home-lockup .mark { width: 42px; height: 42px; display: grid; place-items: center; background: #edf5ff; color: #101827; font-size: 28px; clip-path: polygon(40% 0,100% 0,67% 39%,91% 39%,28% 100%,39% 57%,8% 57%); }
    h1 { margin: 0; color: #edf4ff; font-size: clamp(34px,5vw,48px); letter-spacing: -.055em; }
    h1 .glow-text { color: #98b9e8; background: none; -webkit-text-fill-color: currentColor; animation: none; font-weight: 500; }
    p.subtitle { margin: 10px 0 30px; color: #8ea3c1; font-size: 14px; }
    .home-search-label { display: block; margin: 0 0 9px; text-align: left; color: #a9c2e8; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .home-search-hint { border: 1px solid #304561; background: #111c2c; border-radius: 14px; padding: 16px 18px; color: #879dbd; text-align: left; font-size: 13px; cursor: text; }
    .shortcuts-grid { grid-template-columns: repeat(4,1fr); gap: 12px; margin-top: 18px; }
    .shortcut-card { min-height: 96px; justify-content: center; border-radius: 13px; background: #131f32; border-color: #293b57; color: #b9cdea; }
    .shortcut-card:hover { background: #192941; border-color: #6288bb; transform: translateY(-2px); }
    .shortcut-icon { width: 34px; height: 34px; border-radius: 10px; background: #22344f!important; color: #bfd6f7!important; }
    .home-meta { display: flex; justify-content: center; gap: 18px; margin-top: 28px; color: #7085a4; font-size: 10px; }
    @media (max-width: 760px) {
      .browser-bar { flex-wrap: wrap; padding: 9px 12px; }
      .browser-brand { margin-right: auto; }
      .nav-group { order: 2; }
      .address-form { order: 3; min-width: calc(100% - 156px); }
      .status-container { font-size: 0; width: 36px; padding: 0; justify-content: center; }
      #btn-adblock { display: none; }
      .browser-viewport { height: calc(100vh - 106px); }
      .home-splash { padding-top: 44px; }
      .shortcuts-grid { grid-template-columns: repeat(2,1fr); }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none!important; transition: none!important; } }
  </style>
</head>
<body>

  <!-- Background Orbs -->
  <div class="bg-mesh">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <!-- Top Browser Navigation Bar -->
  <header class="browser-bar">
    <div class="browser-brand"><span class="mark">ϟ</span><strong>nova</strong><span>browser</span></div>
    <div class="nav-group">
      <button class="icon-btn" id="btn-back" title="Back">
        <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <button class="icon-btn" id="btn-forward" title="Forward">
        <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
      <button class="icon-btn" id="btn-reload" title="Reload">
        <svg viewBox="0 0 24 24"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      </button>
      <button class="icon-btn" id="btn-home" title="Home">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </button>
    </div>

    <!-- Address / Search Input -->
    <form class="address-form" id="address-form">
      <div class="address-wrapper">
        <div class="site-icon">
          <svg style="width: 16px; height: 16px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </div>
        <input id="address-input" class="address-input" type="text" aria-label="Website address or search" placeholder="Search Brave or type URL..." autocomplete="off" />
        <button class="icon-btn" type="submit" aria-label="Go">Go</button>
      </div>
    </form>

    <button id="btn-adblock" class="status-container" type="button" aria-pressed="true" title="Block common advertising domains; turn off if a site breaks">Ads blocked</button>
    <!-- Connection Status -->
    <div class="status-container">
      <div id="status-dot" class="status-dot"></div>
      <span id="status-text" role="status">Connecting</span>
    </div>
  </header>

  <!-- Main Viewport Layer -->
  <main class="browser-viewport">
    
    <!-- Home Dashboard Splash -->
    <div id="home-splash" class="home-splash">
      <div class="glass-card">
        <div class="home-lockup"><span class="mark">ϟ</span><h1>nova <span class="glow-text">browser</span></h1></div>
        <p class="subtitle">A focused gateway for the sites you use most.</p>
        <span class="home-search-label">Start browsing</span>
        <div class="home-search-hint" onclick="document.getElementById('address-input').focus()">Search Brave or type a website address</div>
        
        <!-- Quick App Launchers -->
        <div class="shortcuts-grid">
          <div class="shortcut-card" onclick="launchUrl('https://google.com')">
            <div class="shortcut-icon" style="background: rgba(234, 67, 53, 0.2); color: #ea4335;">G</div>
            <span>Google</span>
          </div>
          <div class="shortcut-card" onclick="launchUrl('https://youtube.com')">
            <div class="shortcut-icon" style="background: rgba(255, 0, 0, 0.2); color: #ff0000;">Y</div>
            <span>YouTube</span>
          </div>
          <div class="shortcut-card" onclick="launchUrl('https://discord.com')">
            <div class="shortcut-icon" style="background: rgba(88, 101, 242, 0.2); color: #5865f2;">D</div>
            <span>Discord</span>
          </div>
          <div class="shortcut-card" onclick="launchUrl('https://wikipedia.org')">
            <div class="shortcut-icon" style="background: rgba(255, 255, 255, 0.2); color: #fff;">W</div>
            <span>Wikipedia</span>
          </div>
        </div>
        <div class="home-meta"><span>Private session</span><span>•</span><span>Built-in ad controls</span><span>•</span><span>Nova network</span></div>
      </div>
    </div>

    <!-- Active Web Browser Iframe -->
    <iframe id="web-frame" title="Website" allow="autoplay; fullscreen; gamepad" allowfullscreen></iframe>
  </main>

  <script>
    const form = document.getElementById('address-form');
    const input = document.getElementById('address-input');
    const statusText = document.getElementById('status-text');
    const statusDot = document.getElementById('status-dot');
    const iframe = document.getElementById('web-frame');
    const homeSplash = document.getElementById('home-splash');

    // Controls
    const btnBack = document.getElementById('btn-back');
    const btnForward = document.getElementById('btn-forward');
    const btnReload = document.getElementById('btn-reload');
    const btnHome = document.getElementById('btn-home');

    const adblockButton = document.getElementById('btn-adblock');
    let adblockEnabled = true;
    try { adblockEnabled = localStorage.getItem('nova-adblock') !== 'false'; } catch {}
    function updateAdblockLabel() {
      adblockButton.textContent = adblockEnabled ? 'Ads blocked' : 'Ads allowed';
      adblockButton.setAttribute('aria-pressed', String(adblockEnabled));
    }
    updateAdblockLabel();
    function syncAdblock() {
      return new Promise((resolve, reject) => {
        const channel = new MessageChannel();
        const timer = setTimeout(() => { channel.port1.close(); reject(new Error('Settings update timed out')); }, 5000);
        channel.port1.onmessage = () => { clearTimeout(timer); channel.port1.close(); resolve(); };
        navigator.serviceWorker.controller.postMessage({ type: 'set-adblock', enabled: adblockEnabled }, [channel.port2]);
      });
    }
    const engineReady = (async () => {
      if (!isSecureContext || !('serviceWorker' in navigator)) throw new Error('Use HTTPS and a browser with service workers');
      const registration = await navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' });
      const installing = registration.installing || registration.waiting;
      if (installing && installing.state !== 'activated') await new Promise((resolve, reject) => {
        const changed = () => {
          if (installing.state === 'activated' || installing.state === 'redundant') {
            clearTimeout(timer);
            installing.removeEventListener('statechange', changed);
            installing.state === 'activated' ? resolve() : reject(new Error('Engine update failed; reload to retry'));
          }
        };
        const timer = setTimeout(() => { installing.removeEventListener('statechange', changed); reject(new Error('Engine update timed out')); }, 15000);
        installing.addEventListener('statechange', changed);
      });
      await Promise.race([
        navigator.serviceWorker.ready,
        new Promise((_, reject) => setTimeout(() => reject(new Error('Engine startup timed out; reload to retry')), 15000)),
      ]);
      if (!navigator.serviceWorker.controller) await new Promise((resolve, reject) => {
        const changed = () => { clearTimeout(timer); resolve(); };
        const timer = setTimeout(() => { navigator.serviceWorker.removeEventListener('controllerchange', changed); reject(new Error('Reload to activate the engine')); }, 15000);
        navigator.serviceWorker.addEventListener('controllerchange', changed, { once: true });
      });
      await syncAdblock();
      statusText.textContent = 'Ready';
      statusDot.className = 'status-dot ready';
    })();
    engineReady.catch(error => {
      statusText.textContent = error.message;
      statusDot.className = 'status-dot';
    });
    adblockButton.addEventListener('click', async () => {
      try {
        await engineReady;
        adblockEnabled = !adblockEnabled;
        try { localStorage.setItem('nova-adblock', String(adblockEnabled)); } catch {}
        await syncAdblock();
        updateAdblockLabel();
      } catch (error) { statusText.textContent = error.message; }
    });

    // Process & Launch Requests
    async function launchUrl(url) {
      let query = url.trim();
      if (!query) return;

      if (!query.startsWith('http://') && !query.startsWith('https://')) {
        if (query.includes('.') && !query.includes(' ')) {
          query = 'https://' + query;
        } else {
          query = 'https://search.brave.com/search?q=' + encodeURIComponent(query);
        }
      }

      try { await engineReady; } catch { return; }
      // Hide Splash & Display Web Frame
      homeSplash.style.display = 'none';
      iframe.style.display = 'block';

      // Encode URL with Ultraviolet
      const destinationUrl = __uv$config.prefix + __uv$config.encodeUrl(query);
      iframe.src = destinationUrl;
      input.value = query;
    }

    // Form Event Handler
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      launchUrl(input.value);
    });

    // Browser Control Button Actions
    btnBack.addEventListener('click', () => {
      try { iframe.contentWindow.history.back(); } catch(e) {}
    });

    btnForward.addEventListener('click', () => {
      try { iframe.contentWindow.history.forward(); } catch(e) {}
    });

    btnReload.addEventListener('click', () => {
      try { iframe.contentWindow.location.reload(); } catch(e) {}
    });

    btnHome.addEventListener('click', () => {
      iframe.src = 'about:blank';
      iframe.style.display = 'none';
      homeSplash.style.display = 'flex';
      input.value = '';
    });

    // Sync input bar when iframe location updates
    iframe.addEventListener('load', () => {
      try {
        const loc = iframe.contentWindow.location.href;
        if (loc.includes(__uv$config.prefix)) {
          const rawUrl = loc.split(__uv$config.prefix)[1];
          if (rawUrl) {
            input.value = __uv$config.decodeUrl(rawUrl);
          }
        }
      } catch (e) {
        // Handle cross-origin restrictions gracefully
      }
    });
  </script>
</body>
</html>
