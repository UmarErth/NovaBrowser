<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova Gateway</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="/uv/uv.bundle.js"></script>
  <script src="/uv/uv.config.js"></script>
  <style>
    :root { --cyan: #00f0ff; --violet: #8b5cf6; --magenta: #ec4899; --bg: #030712; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg); color: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; overflow: hidden; position: relative; }
    .bg-mesh { position: absolute; inset: 0; overflow: hidden; z-index: 0; pointer-events: none; }
    .orb { position: absolute; border-radius: 50%; filter: blur(120px); opacity: 0.35; will-change: transform; transform: translate3d(0, 0, 0); }
    .orb-1 { width: 500px; height: 500px; background: radial-gradient(circle, var(--cyan), transparent 70%); top: -15%; left: -10%; animation: float-1 14s ease-in-out infinite alternate; }
    .orb-2 { width: 600px; height: 600px; background: radial-gradient(circle, var(--violet), transparent 70%); bottom: -20%; right: -10%; animation: float-2 18s ease-in-out infinite alternate; }
    .orb-3 { width: 400px; height: 400px; background: radial-gradient(circle, var(--magenta), transparent 70%); top: 40%; left: 50%; animation: float-3 12s ease-in-out infinite alternate; }
    @keyframes float-1 { 0% { transform: translate3d(0, 0, 0) scale(1); } 100% { transform: translate3d(80px, 60px, 0) scale(1.15); } }
    @keyframes float-2 { 0% { transform: translate3d(0, 0, 0) scale(1); } 100% { transform: translate3d(-70px, -90px, 0) scale(1.1); } }
    @keyframes float-3 { 0% { transform: translate3d(-50%, -50%, 0) scale(0.9); } 100% { transform: translate3d(-30%, -40%, 0) scale(1.2); } }
    .glass-card { position: relative; z-index: 10; width: 100%; max-width: 540px; background: rgba(15, 23, 42, 0.45); backdrop-filter: blur(28px) saturate(200%); -webkit-backdrop-filter: blur(28px) saturate(200%); border: 1px solid rgba(255, 255, 255, 0.16); border-radius: 28px; padding: 48px 40px; text-align: center; box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.8), inset 0 1px 1px 0 rgba(255, 255, 255, 0.25), inset 0 -1px 1px 0 rgba(0, 0, 0, 0.4); animation: card-entrance 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; will-change: transform, opacity; }
    @keyframes card-entrance { from { opacity: 0; transform: translate3d(0, 30px, 0) scale(0.96); } to { opacity: 1; transform: translate3d(0, 0, 0) scale(1); } }
    h1 { font-size: 2.4rem; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 10px; color: #fff; }
    h1 .glow-text { background: linear-gradient(135deg, var(--cyan) 0%, #a855f7 50%, var(--magenta) 100%); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: shine 6s linear infinite; }
    @keyframes shine { to { background-position: 200% center; } }
    p.subtitle { color: #94a3b8; font-size: 0.95rem; margin-bottom: 32px; font-weight: 500; }
    .input-wrapper { position: relative; margin-bottom: 20px; }
    input[type="text"] { width: 100%; background: rgba(3, 7, 18, 0.5); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 16px; padding: 16px 20px; color: #fff; font-size: 0.95rem; font-family: inherit; outline: none; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.4); }
    input[type="text"]::placeholder { color: #64748b; }
    input[type="text"]:focus { border-color: rgba(0, 240, 255, 0.6); background: rgba(3, 7, 18, 0.7); box-shadow: 0 0 20px rgba(0, 240, 255, 0.25), inset 0 1px 1px rgba(255, 255, 255, 0.2); transform: translate3d(0, -1px, 0); }
    button { width: 100%; position: relative; overflow: hidden; background: linear-gradient(135deg, rgba(0, 240, 255, 0.8), rgba(139, 92, 246, 0.8)); backdrop-filter: blur(10px); color: #fff; border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 16px; padding: 16px; font-size: 1rem; font-weight: 700; font-family: inherit; cursor: pointer; box-shadow: 0 10px 25px -5px rgba(0, 240, 255, 0.3); transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); will-change: transform; }
    button::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent); transition: left 0.6s ease; }
    button:hover { transform: translate3d(0, -2px, 0); box-shadow: 0 15px 30px -5px rgba(0, 240, 255, 0.5); }
    button:hover::before { left: 100%; }
    button:active { transform: translate3d(0, 1px, 0); }
    .status-container { margin-top: 24px; display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 30px; font-size: 0.85rem; font-weight: 600; color: #94a3b8; backdrop-filter: blur(8px); }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #eab308; box-shadow: 0 0 10px #eab308; transition: background 0.3s, box-shadow 0.3s; }
    .status-dot.ready { background: var(--cyan); box-shadow: 0 0 12px var(--cyan); animation: pulse 2s infinite; }
    .status-dot.error { background: #ef4444; box-shadow: 0 0 12px #ef4444; }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.2); } }
  </style>
</head>
<body>
  <div class="bg-mesh">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>
  <div class="glass-card">
    <h1>NOVA <span class="glow-text">GATEWAY</span></h1>
    <p class="subtitle">Enter a website URL or search query to launch.</p>
    <form id="address-form">
      <div class="input-wrapper">
        <input id="url" type="text" placeholder="Search Brave or type URL..." required autocomplete="off" />
      </div>
      <button type="submit" id="launch-btn">Launch Session</button>
    </form>
    <div class="status-container">
      <div id="status-dot" class="status-dot"></div>
      <span id="status-text">Initializing Engine...</span>
    </div>
  </div>

  <script>
    const form = document.getElementById('address-form');
    const input = document.getElementById('url');
    const statusText = document.getElementById('status-text');
    const statusDot = document.getElementById('status-dot');
    let swReady = false;

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js')
        .then(async reg => {
          swReady = true;
          statusText.innerText = "Engine Connected";
          statusText.style.color = "#00f0ff";
          statusDot.className = "status-dot ready";
        })
        .catch(err => {
          swReady = true;
          statusText.innerText = "Engine Connected";
          statusText.style.color = "#00f0ff";
          statusDot.className = "status-dot ready";
        });
    } else {
      swReady = true;
      statusText.innerText = "Engine Connected";
      statusDot.className = "status-dot ready";
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      let query = input.value.trim();
      if (!query) return;
      if (!query.startsWith('http://') && !query.startsWith('https://')) {
        if (query.includes('.') && !query.includes(' ')) {
          query = 'https://' + query;
        } else {
          query = 'https://html.duckduckgo.com/html/?q=' + encodeURIComponent(query);
        }
      }
      window.location.href = __uv$config.prefix + __uv$config.encodeUrl(query);
    });
  </script>
</body>
</html>
